      card.append(heading,paragraph,list); return card;
    }

      const activeDetail = detail || serviceData.implementation;

          const heading=document.createElement("h3"); heading.textContent=t(app.name); const code=document.createElement("small"); code.textContent=app.code; top.append(heading,code);
          const description=document.createElement("p"); description.textContent=t(app.description);
          const more=document.createElement("span"); more.className="app-more"; more.innerHTML=`<span>${lang === "ar" ? "تفاصيل التطبيق" : "App details"}</span><b aria-hidden="true">↗</b>`;
          copy.append(top,description,more); card.append(preview,copy); document.getElementById("appsGrid").append(card);
        });
      }else if(activeDetail.panels){
        activeDetail.panels.forEach((panel,index)=>document.getElementById("detailGrid").append(makeCard(panel,index)));
      }else{
        const modulePanels=[
          {title:{ar:"ماذا يقدم التطبيق؟",en:"What the app does"},body:activeDetail.description,items:[{ar:"وظائف أساسية قابلة للتهيئة",en:"Core features that can be configured"},{ar:"بيانات متصلة بسير العمل",en:"Data connected to workflows"},{ar:"صلاحيات حسب دور المستخدم",en:"Access shaped by user role"}]},

      text("footerLine",{ar:"حلول أعمال مترابطة",en:"Connected business systems"});
